<div class="home-container">
  <div class="welcome-section">
    <ng-container *ngIf="isLoggedIn(); else loggedOutWelcome">
      <!-- Messaggio per utente loggato -->
      <h1>Benvenuto/a, {{ userName }} !</h1>
      <p>Esplora i film e le proiezioni disponibili.</p>
      <button (click)="logout()" class="action-button logout-button">
        Logout
      </button>
    </ng-container>

    <ng-template #loggedOutWelcome>
      <!-- Messaggio per utente non loggato -->
      <h1>Benvenuto nel Cinema PSW</h1>
      <p>Accedi o registrati per gestire i tuoi biglietti e la tua area personale.</p>
      <button (click)="vaiAlLogin()" class="action-button login-button">
        Accedi / Registrati
      </button>
    </ng-template>
  </div>

  <div class="card navigation-card">
    <h2>Cosa vuoi fare?</h2>
    <div class="button-group">
      <button (click)="vaiAlCatalogoFilm()" class="nav-button">
        Catalogo Film
      </button>
      <button (click)="vaiAlCatalogoProiezioni()" class="nav-button">
        Catalogo Proiezioni
      </button>
    </div>
  </div>
</div>
