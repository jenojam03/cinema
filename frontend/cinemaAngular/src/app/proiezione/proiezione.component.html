<div class="proiezione-dettagli-container">
  <!-- Dettagli proiezione (sezione superiore) -->
  <div *ngIf="proiezione" class="dettagli-proiezione">
    <h2>{{ proiezione.film.titolo }}</h2>
    <p>Data e ora: {{ proiezione.dataOra | date:'dd/MM/yyyy HH:mm' }}</p>
    <p>Durata: {{ proiezione.film.durata }} minuti</p>
  </div>

  <!-- ✅ Sezione posti -->
  <div class="sezione-posti-container">
    <h3>Seleziona i tuoi posti</h3>

    <!-- Schermo -->
    <div class="schermo">Schermo</div>

    <!-- Messaggi di stato (caricamento, errore, ecc.) -->
    <div *ngIf="isLoading" class="stato-messaggio caricamento">
      Caricamento posti...
    </div>

    <div *ngIf="errorMessage && !isLoading" class="stato-messaggio errore">
      {{ errorMessage }}
    </div>

    <!-- Griglia dei posti (Mostra tutti i posti) -->
    <div *ngIf="!isLoading && !errorMessage" class="posti-grid-wrapper">
      <div class="posti-grid">
        <ng-container *ngFor="let posto of postiTotali">
          <button
            class="posto-button"
            [class.occupato]="posto.occupato"
            [class.selezionato]="isPostoSelezionato(posto)"
            [disabled]="posto.occupato"
            (click)="selezionaPosto(posto)"
            [title]="posto.occupato ? 'Posto occupato' : 'Seleziona posto'"
          >
            {{ posto.fila }}{{ posto.numero }}
          </button>
        </ng-container>
      </div>
    </div>

    <!-- Riepilogo posti selezionati -->
    <div *ngIf="selectedPosti.length > 0 && !isLoading" class="riepilogo-posti">
      <h4>Posti selezionati:</h4>
      <div class="selected-posti-list">
        <span *ngFor="let posto of selectedPosti" class="posto-selezionato-label">
          {{ posto.fila }}{{ posto.numero }}
        </span>
      </div>
    </div>
  </div>

  <!-- ✅ Bottone per procedere all'acquisto -->
  <div class="action-buttons">
    <button (click)="procediAllAcquisto()" class="procedi-button" [disabled]="selectedPosti.length === 0 || isLoading">
      Procedi all'acquisto ({{ selectedPosti.length }} posto/i)
    </button>
  </div>
</div>
